<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIMdb: Artificial Intelligence database</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e8ee; --muted:#9aa3b2; --accent:#6ea8fe; --accent2:#7ee0c0;
    --chip:#232936; --chip-on:#2f6fed; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f6; --border:#dde1e8;
      --text:#1a1d24; --muted:#5b6472; --accent:#2f6fed; --accent2:#0d9488;
      --chip:#eceef3; --chip-on:#2f6fed; --shadow:0 1px 3px rgba(20,30,60,.08);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  header{padding:20px 24px 8px;max-width:1200px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 2px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px 60px;}
  .controls{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;
    border-bottom:1px solid var(--border);}
  .searchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type=search]{flex:1;min-width:240px;padding:10px 12px;border-radius:8px;
    border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:15px;outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  select{padding:10px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{padding:4px 10px;border-radius:999px;border:1px solid var(--border);
    background:var(--chip);color:var(--text);cursor:pointer;font-size:12.5px;user-select:none}
  .chip.on{background:var(--chip-on);border-color:var(--chip-on);color:#fff}
  .chip .n{opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
  .meta{color:var(--muted);font-size:12.5px;margin:10px 0 4px;display:flex;
    justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .clear{color:var(--accent);cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;
    border-bottom:1px solid var(--border);position:sticky;top:64px;background:var(--bg);white-space:nowrap}
  tbody tr.row{border-bottom:1px solid var(--border);cursor:pointer}
  tbody tr.row:hover{background:var(--panel2)}
  td{padding:9px 10px;vertical-align:top}
  .name{font-weight:600;max-width:360px}
  .formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent2)}
  .el{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--chip);
    font-size:11.5px;margin:1px 2px 1px 0;font-weight:600}
  .doi a{color:var(--accent);text-decoration:none}
  .doi a:hover{text-decoration:underline}
  .detail td{background:var(--panel);padding:0}
  .detailinner{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:2px 24px}
  @media(max-width:720px){.detailinner{grid-template-columns:1fr}}
  .field{padding:6px 0;border-bottom:1px solid var(--border)}
  .field .k{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
  .field .v{white-space:pre-wrap;word-break:break-word}
  .field.wide{grid-column:1/-1}
  mark{background:rgba(110,168,254,.35);color:inherit;border-radius:2px;padding:0 1px}
  .empty{color:var(--muted);font-style:italic}
  .none{opacity:.5}
</style>
</head>
<body>
<header>
  <h1>AIMdb: Artificial Intelligence database</h1>
  <div class="sub" id="subtitle">Loading…</div>
</header>
<div class="wrap">
  <div class="controls">
    <div class="searchrow">
      <input id="q" type="search" placeholder="Search name, formula, element, method, reference…" autocomplete="off">
      <select id="scope" title="Restrict the search box to one field">
        <option value="all">All fields</option>
        <option value="compound_name">Name</option>
        <option value="formula">Formula</option>
        <option value="element">Element</option>
        <option value="method">Method</option>
        <option value="reference_short">Reference</option>
      </select>
      <select id="sort" title="Sort order">
        <option value="year_desc">Year ↓</option>
        <option value="year_asc">Year ↑</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
    <div class="chips" id="elementChips"></div>
  </div>
  <div class="meta">
    <span id="count"></span>
    <span class="clear" id="clear" hidden>Clear all filters ✕</span>
  </div>
  <table>
    <thead><tr>
      <th>Compound</th><th>Formula</th><th>Element(s)</th>
      <th>Method</th><th>Active space</th><th>Year</th><th>Reference</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script src="data.js"></script>
<script>
const DATA = (window.LIT && window.LIT.rows) || [];
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- element facet counts ----
const elCount = {};
DATA.forEach(r => (r._elements||[]).forEach(e => elCount[e] = (elCount[e]||0)+1));
const elOrder = Object.keys(elCount).sort((a,b)=>elCount[b]-elCount[a] || a.localeCompare(b));

const state = { q:"", scope:"all", sort:"year_desc", els:new Set() };

function renderChips(){
  const box = $("#elementChips");
  box.innerHTML = elOrder.map(e =>
    `<span class="chip ${state.els.has(e)?'on':''}" data-el="${e}">${e}<span class="n">${elCount[e]}</span></span>`
  ).join("");
}

function matchesText(r){
  if(!state.q) return true;
  const needle = state.q.toLowerCase();
  const pick = state.scope;
  let hay;
  if(pick==="all"){
    hay = [r.compound_name, r.formula, r.metal_center, r.method, r.software,
           r.ligand_set, r.reference_short, r.reference_doi, r.notes,
           (r._elements||[]).join(" ")].join("  ");
  } else if(pick==="element"){
    hay = (r._elements||[]).join(" ") + " " + r.metal_center;
  } else {
    hay = r[pick] || "";
  }
  return hay.toLowerCase().includes(needle);
}
function matchesEls(r){
  if(state.els.size===0) return true;
  const set = new Set(r._elements||[]);
  for(const e of state.els) if(!set.has(e)) return false; // AND semantics
  return true;
}

function highlight(text){
  text = esc(text||"");
  if(!state.q || state.scope==="element") return text;
  try{
    const re = new RegExp("("+state.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")","ig");
    return text.replace(re,"<mark>$1</mark>");
  }catch(e){ return text; }
}

const FIELD_LABELS = {
  entry_id:"Entry ID", structure_file:"Structure file", compound_name:"Compound name",
  formula:"Formula", metal_center:"Metal center", metal_ox_state:"Oxidation state",
  d_electron_count:"d-electron count", ligand_set:"Ligand set", point_group:"Point group",
  geometry_source:"Geometry source", method:"Method", software:"Software",
  basis_set:"Basis set", relativistic_treatment:"Relativistic treatment",
  soc_included:"SOC included", ss_included:"Spin-spin included",
  active_space_nel:"Active electrons", active_space_norb:"Active orbitals",
  active_space_orbital_description:"Active-space orbitals",
  active_space_protocol:"Active-space protocol",
  multiplicities_studied:"Multiplicities", nroots_per_mult:"Roots per multiplicity",
  ground_state_mult:"Ground-state multiplicity", ground_state_term:"Ground-state term",
  low_lying_states_eV:"Low-lying states (eV)", Other:"Other",
  reference_short:"Reference", reference_doi:"DOI", year:"Year", notes:"Notes",
};
const WIDE = new Set(["active_space_orbital_description","active_space_protocol",
  "low_lying_states_eV","Other","notes","compound_name","ligand_set","geometry_source"]);
const HIDE = new Set(["_metals","_elements"]);

function activeSpace(r){
  const n=r.active_space_nel, o=r.active_space_norb;
  return (n||o) ? `(${n||"?"}e, ${o||"?"}o)` : "";
}
function detail(r){
  const fields = (window.LIT.fields||[]).filter(f=>!HIDE.has(f));
  const cells = fields.map(f=>{
    let v = r[f];
    if(f==="reference_doi" && v) v = `<a href="https://doi.org/${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`;
    else v = v ? highlight(v) : '<span class="empty">—</span>';
    const cls = WIDE.has(f) ? "field wide" : "field";
    return `<div class="${cls}"><div class="k">${esc(FIELD_LABELS[f]||f)}</div><div class="v">${v}</div></div>`;
  }).join("");
  return `<div class="detailinner">${cells}</div>`;
}

function elBadges(r){
  const list = r._elements||[];
  if(list.length===0) return '<span class="el none">—</span>';
  return list.map(e=>`<span class="el">${e}</span>`).join("");
}

function render(){
  let rows = DATA.filter(r=>matchesText(r) && matchesEls(r));
  rows.sort((a,b)=>{
    if(state.sort==="name") return (a.compound_name||"").localeCompare(b.compound_name||"");
    const ya=+a.year||0, yb=+b.year||0;
    return state.sort==="year_asc" ? ya-yb : yb-ya;
  });
  const tb = $("#tbody");
  tb.innerHTML = rows.map((r,i)=>{
    const doi = r.reference_doi ? `<a href="https://doi.org/${esc(r.reference_doi)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(r.reference_short||r.reference_doi)}</a>` : esc(r.reference_short||"");
    const formula = r.formula ? `<span class="formula">${highlight(r.formula)}</span>` : '<span class="empty">—</span>';
    return `<tr class="row" data-i="${i}">
      <td class="name">${highlight(r.compound_name)}</td>
      <td>${formula}</td>
      <td>${elBadges(r)}</td>
      <td>${highlight(r.method)}</td>
      <td>${esc(activeSpace(r))}</td>
      <td>${esc(r.year)}</td>
      <td class="doi">${doi}</td>
    </tr>
    <tr class="detail" data-d="${i}" hidden><td colspan="7">${detail(r)}</td></tr>`;
  }).join("");
  $("#count").textContent = `${rows.length} of ${DATA.length} entries`;
  const any = state.q || state.els.size || state.scope!=="all";
  $("#clear").hidden = !any;
  // store filtered rows for expand handler
  tb._rows = rows;
}

// ---- events ----
$("#q").addEventListener("input", e=>{ state.q=e.target.value.trim(); render(); });
$("#scope").addEventListener("change", e=>{ state.scope=e.target.value; render(); });
$("#sort").addEventListener("change", e=>{ state.sort=e.target.value; render(); });
$("#elementChips").addEventListener("click", e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const el=c.dataset.el;
  state.els.has(el) ? state.els.delete(el) : state.els.add(el);
  renderChips(); render();
});
$("#tbody").addEventListener("click", e=>{
  const tr=e.target.closest("tr.row"); if(!tr) return;
  const d=$(`tr.detail[data-d="${tr.dataset.i}"]`);
  if(d) d.hidden=!d.hidden;
});
$("#clear").addEventListener("click", ()=>{
  state.q=""; state.els.clear(); state.scope="all";
  $("#q").value=""; $("#scope").value="all";
  renderChips(); render();
});

// ---- init ----
if(!window.LIT){
  $("#subtitle").textContent = "Could not load data.js — run: python3 site/build_site.py";
} else {
  $("#subtitle").textContent =
    `${DATA.length} CASSCF-family calculations · ${elOrder.length} elements · built ${window.LIT.generated}`;
  renderChips();
  render();
}
</script>
</body>
</html>
